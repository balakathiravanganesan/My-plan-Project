<div id="header" class="app-header">
  <div class="flex-row header-content">
    <div class="app-name flex-col">
    <img
      src="images/idea-box.png"
      alt=""
      class="idea-logo"
    />
    </div>
    <div class="headers">
    <div class="header-username">
        <div class="header-name"> {{ userName }}, Your ideas deserve a plan. </div>
        <label class="sub-header">Here's idea is overview.</label>
    </div>
    <mat-icon class="wavinghand-icon">tips_and_updates</mat-icon>
    </div>
    
<div class="header-actions">

  <button class="notification-button">
    <mat-icon>notifications_none</mat-icon>
    <span class="notification-dot"></span>
  </button>

  <div class="profile-circle">
    {{ userInitial }}
  </div>

</div>
</div>
</div>
